name: release_changelog

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to add to CHANGELOG.md, for example v1.0.6"
        required: true
        type: string
      from_ref:
        description: "Previous tag/ref. Leave empty to use the latest semver tag."
        required: false
        type: string
      to_ref:
        description: "Target ref to include. Defaults to HEAD."
        required: false
        default: "HEAD"
        type: string
      replace:
        description: "Replace the existing section for this version if it already exists."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  update-changelog:
    name: Update CHANGELOG.md
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'preprod' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Generate changelog section
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          FROM_REF: ${{ inputs.from_ref }}
          TO_REF: ${{ inputs.to_ref }}
          REPLACE_SECTION: ${{ inputs.replace }}
        run: |
          set -euo pipefail

          args=(--version "$RELEASE_VERSION" --to "$TO_REF")

          if [ -n "$FROM_REF" ]; then
            args+=(--from "$FROM_REF")
          fi

          if [ "$REPLACE_SECTION" = "true" ]; then
            args+=(--replace)
          fi

          node scripts/generate-changelog.mjs "${args[@]}"

      - name: Commit changelog
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Update changelog for $RELEASE_VERSION"
          git push origin "HEAD:${GITHUB_REF_NAME}"

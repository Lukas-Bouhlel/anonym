name: cd_deploy_to_production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_google_play:
        description: Publish the Android App Bundle to Google Play
        required: true
        type: boolean
        default: false
      google_play_track:
        description: Google Play release track
        required: true
        type: choice
        options:
          - production
          - internal
        default: production
      google_play_status:
        description: Draft requires a final manual validation in Play Console
        required: true
        type: choice
        options:
          - draft
          - completed
        default: draft

permissions:
  contents: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  VPS_HOST: 51.75.18.155
  VPS_PORT: "53339"
  VPS_USER: lukas
  MOBILE_ARTIFACTS_DIR: /home/lukas/mobile-artifacts/anonym

jobs:
  prepare-production-deploy:
    name: Prepare production deployment
    runs-on: ubuntu-latest

    steps:
      - name: CI gate
        run: |
          echo "Production deployment authorized from preprod-gated main."
          echo "Trigger: ${{ github.event_name }}"

  validate-release-version:
    name: Validate release version
    runs-on: ubuntu-latest
    needs: prepare-production-deploy
    outputs:
      release_tag: ${{ steps.release_version.outputs.release_tag }}
      release_version: ${{ steps.release_version.outputs.release_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check CHANGELOG release tag
        id: release_version
        run: |
          set -euo pipefail

          release_tag="$(sed -nE 's/^## (v[0-9]+\.[0-9]+\.[0-9]+[^ ]*) .*/\1/p' CHANGELOG.md | head -n 1)"

          if [ -z "$release_tag" ]; then
            echo "No release tag found in CHANGELOG.md. Expected a heading like: ## v1.0.5 - 2026-08-05"
            exit 1
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_version=${release_tag#v}" >> "$GITHUB_OUTPUT"

          git fetch --tags origin

          if git rev-parse -q --verify "refs/tags/$release_tag" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "$release_tag")"
            if [ "$tag_sha" = "$GITHUB_SHA" ]; then
              echo "Tag $release_tag already exists on this commit. Redeployment is allowed."
              exit 0
            fi

            echo "Release tag $release_tag already exists on another commit: $tag_sha"
            echo "Run release_changelog on preprod with a new version before merging to main."
            exit 1
          fi

          echo "Release tag $release_tag is available for this production deployment."

  build-mobile-apk:
    name: Build signed Android artifacts
    runs-on: ubuntu-latest
    needs: validate-release-version

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Android release signing
        working-directory: ./anonym_front_flutter
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build Android release APK and App Bundle
        working-directory: ./anonym_front_flutter
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          MOBILE_API_BASE_URL: ${{ secrets.MOBILE_API_BASE_URL }}
          RELEASE_VERSION: ${{ needs.validate-release-version.outputs.release_version }}
        run: |
          set -euo pipefail
          API_BASE_URL="${MOBILE_API_BASE_URL:-https://www.ano-nym.fr}"
          API_HOST="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.urlparse(sys.argv[1]).hostname or "")' "$API_BASE_URL")"
          TLS_PINNED_CERT_SHA256="$(echo | openssl s_client -connect "$API_HOST:443" -servername "$API_HOST" 2>/dev/null | openssl x509 -noout -fingerprint -sha256 | sed 's/^.*=//' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          # Keep automated version codes above the manually uploaded bootstrap bundle (1081).
          BUILD_NUMBER="$((100000 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))"
          test -n "$TLS_PINNED_CERT_SHA256"
          test -n "$RELEASE_VERSION"
          flutter pub get
          flutter build apk --release \
            --build-name="$RELEASE_VERSION" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=APP_ENV=prod \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=MAPBOX_ACCESS_TOKEN="$MAPBOX_ACCESS_TOKEN" \
            --dart-define=TLS_PINNED_CERT_SHA256="$TLS_PINNED_CERT_SHA256"
          flutter build appbundle --release \
            --build-name="$RELEASE_VERSION" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=APP_ENV=prod \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=MAPBOX_ACCESS_TOKEN="$MAPBOX_ACCESS_TOKEN" \
            --dart-define=TLS_PINNED_CERT_SHA256="$TLS_PINNED_CERT_SHA256"
          mkdir -p ../mobile-release
          SHORT_SHA="$(git rev-parse --short HEAD)"
          RELEASE_DATE="$(date -u +%Y%m%d%H%M%S)"
          ARTIFACT_BASENAME="anonym-${RELEASE_VERSION}-${BUILD_NUMBER}-${RELEASE_DATE}-${SHORT_SHA}"
          cp build/app/outputs/flutter-apk/app-release.apk "../mobile-release/${ARTIFACT_BASENAME}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "../mobile-release/${ARTIFACT_BASENAME}.aab"

      - name: Store APK for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: production-mobile-apk
          path: mobile-release/*.apk
          if-no-files-found: error
          retention-days: 1

      - name: Store App Bundle for Google Play
        uses: actions/upload-artifact@v4
        with:
          name: production-mobile-aab
          path: mobile-release/*.aab
          if-no-files-found: error
          retention-days: 7

  deploy-vps:
    name: Deploy web and backend to VPS
    runs-on: ubuntu-latest
    needs: build-mobile-apk

    steps:
      - name: Create SSH directory
        run: mkdir -p ~/.ssh

      - name: Set up known_hosts
        run: ssh-keyscan -H -t rsa -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.LUKAS_KEY_PRIVATE }}

      - name: Deploy to VPS
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -se' << 'EOF'
          set -euo pipefail
          cd /home/ubuntu/anonym

          git fetch origin main
          git checkout main

          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Deployment stopped: the server repository has local changes."
            echo "Review/commit/stash/clean changes in /home/ubuntu/anonym before deploying."
            git status --short
            exit 1
          fi

          local_sha="$(git rev-parse main)"
          remote_sha="$(git rev-parse origin/main)"
          merge_base="$(git merge-base main origin/main)"

          if [ "$local_sha" = "$remote_sha" ]; then
            echo "Server repository already matches origin/main."
          elif [ "$local_sha" = "$merge_base" ]; then
            git merge --ff-only origin/main
          else
            backup_branch="server-main-backup-$(date -u +%Y%m%d%H%M%S)"
            git branch "$backup_branch" "$local_sha"
            echo "Server main diverged. Saved local main as $backup_branch."
            git reset --hard origin/main
          fi

          export COMPOSE_HTTP_TIMEOUT=600
          export DOCKER_CLIENT_TIMEOUT=600
          docker-compose -f docker-compose.prod.yml --env-file .env.production up -d --build --remove-orphans
          docker-compose -f docker-compose.prod.yml --env-file .env.production ps
          EOF

  publish-mobile-apk:
    name: Publish APK to VPS
    runs-on: ubuntu-latest
    needs: deploy-vps

    steps:
      - name: Create SSH directory
        run: mkdir -p ~/.ssh

      - name: Set up known_hosts
        run: ssh-keyscan -H -t rsa -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.LUKAS_KEY_PRIVATE }}

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: production-mobile-apk
          path: mobile-release

      - name: Upload Android APK to VPS
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p '$MOBILE_ARTIFACTS_DIR'"
          scp -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -P "$VPS_PORT" mobile-release/*.apk "$VPS_USER@$VPS_HOST:$MOBILE_ARTIFACTS_DIR/"
          ssh -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "cd '$MOBILE_ARTIFACTS_DIR' && ls -1t anonym-*.apk | tail -n +11 | xargs -r rm -f && ls -lh"

  publish-google-play:
    name: Publish Android App Bundle to Google Play
    runs-on: ubuntu-latest
    needs:
      - validate-release-version
      - build-mobile-apk
      - deploy-vps
    if: >-
      ${{
        vars.GOOGLE_PLAY_AUTO_PUBLISH == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_google_play == true)
      }}
    environment:
      name: google-play-production

    steps:
      - name: Download Android App Bundle
        uses: actions/download-artifact@v4
        with:
          name: production-mobile-aab
          path: mobile-release

      - name: Validate Google Play credentials
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" || {
            echo "Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON in the google-play-production environment."
            exit 1
          }
          python3 -c 'import json, os; payload=json.loads(os.environ["GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"]); assert payload.get("type") == "service_account" and payload.get("client_email") and payload.get("private_key")'

      - name: Upload production bundle to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.anonym.front_flutter
          releaseFiles: mobile-release/*.aab
          tracks: ${{ github.event_name == 'workflow_dispatch' && inputs.google_play_track || vars.GOOGLE_PLAY_TRACK || 'production' }}
          status: ${{ github.event_name == 'workflow_dispatch' && inputs.google_play_status || vars.GOOGLE_PLAY_RELEASE_STATUS || 'completed' }}
          releaseName: ${{ needs.validate-release-version.outputs.release_tag }}
          changesNotSentForReview: false

  tag-production-release:
    name: Tag production release
    runs-on: ubuntu-latest
    needs:
      - publish-mobile-apk
      - publish-google-play
    if: >-
      ${{
        always() &&
        needs.publish-mobile-apk.result == 'success' &&
        (needs.publish-google-play.result == 'success' || needs.publish-google-play.result == 'skipped')
      }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Create release tag from CHANGELOG
        run: |
          set -euo pipefail

          release_tag="$(sed -nE 's/^## (v[0-9]+\.[0-9]+\.[0-9]+[^ ]*) .*/\1/p' CHANGELOG.md | head -n 1)"

          if [ -z "$release_tag" ]; then
            echo "No release tag found in CHANGELOG.md. Expected a heading like: ## v1.0.5 - 2026-08-05"
            exit 1
          fi

          git fetch --tags origin

          if git rev-parse -q --verify "refs/tags/$release_tag" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "$release_tag")"
            if [ "$tag_sha" = "$GITHUB_SHA" ]; then
              echo "Tag $release_tag already exists on this commit. Nothing to do."
              exit 0
            fi

            echo "Tag $release_tag already exists on another commit: $tag_sha"
            echo "Refusing to move an existing release tag."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$release_tag" "$GITHUB_SHA" -m "Release $release_tag"
          git push origin "$release_tag"
